<text class="m" x="24" y="222" font-size="11" text-anchor="start" xml:space="preserve">surface = lens(pages)</text>
<text class="m" x="24" y="235" font-size="11" text-anchor="start" xml:space="preserve">pages = lens⁻¹(surface)</text>
<text class="m" x="268" y="223" font-size="8.5" text-anchor="start" xml:space="preserve">one mapping, read both ways: pages to a surface,</text>
<text class="m" x="268" y="234" font-size="8.5" text-anchor="start" xml:space="preserve">and back to writes. a page a character keeps; unbuilt.</text>
