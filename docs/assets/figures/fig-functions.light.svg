<text class="m" x="24" y="196" font-size="11" text-anchor="start" xml:space="preserve">answer = model(prompt(embeds))</text>
<text class="m" x="268" y="191" font-size="8.5" text-anchor="start" xml:space="preserve">impure: asks a model, tries providers in order;</text>
<text class="m" x="268" y="202" font-size="8.5" text-anchor="start" xml:space="preserve">the answer is recorded; a settled question is not re-asked.</text>
