<text class="m" x="24" y="132" font-size="11" text-anchor="start" xml:space="preserve">value = measure(page)</text>
<text class="m" x="268" y="127" font-size="8.5" text-anchor="start" xml:space="preserve">pure; the value is committed as a write,</text>
<text class="m" x="268" y="138" font-size="8.5" text-anchor="start" xml:space="preserve">so reading history never evaluates an expression.</text>
