<text class="m" x="174" y="30" font-size="9" text-anchor="start" xml:space="preserve">what each part computes</text>
<text class="m" x="24" y="68" font-size="11" text-anchor="start" xml:space="preserve">pages = rebuild(history)</text>
<text class="m" x="268" y="63" font-size="8.5" text-anchor="start" xml:space="preserve">the history is the truth; pages are its committed files.</text>
<text class="m" x="268" y="74" font-size="8.5" text-anchor="start" xml:space="preserve">rebuild restores the tree from the history.</text>
