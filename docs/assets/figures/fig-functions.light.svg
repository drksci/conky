<text class="m" x="24" y="100" font-size="11" text-anchor="start" xml:space="preserve">ok = rule(page)</text>
<text class="m" x="268" y="95" font-size="8.5" text-anchor="start" xml:space="preserve">pure: no clock, no randomness, no input or output.</text>
<text class="m" x="268" y="106" font-size="8.5" text-anchor="start" xml:space="preserve">false: the write is refused and the refusal recorded.</text>
