<text class="m" x="24" y="164" font-size="11" text-anchor="start" xml:space="preserve">write′ = watch(change)</text>
<text class="m" x="268" y="159" font-size="8.5" text-anchor="start" xml:space="preserve">a change in, a write out, signed by the watcher;</text>
<text class="m" x="268" y="170" font-size="8.5" text-anchor="start" xml:space="preserve">nested to depth 12, then refused as a cycle.</text>
