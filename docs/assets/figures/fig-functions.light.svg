<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 304" width="880" height="304" role="img" aria-labelledby="t">
<title id="t">Plate 4, the functions: pages equal rebuild of history; a rule is a pure check that refuses a false write; a measure is pure and its value is committed; a watch maps a change to another write up to depth 12; a model call is the one impure step; a lens maps pages to a surface and back, planned. One change runs write, rule, seal, watch, write, with refusal as a branch.</title>
