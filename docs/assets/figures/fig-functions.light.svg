<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 10 848 322" width="848" height="322" role="img" aria-labelledby="t">
<title id="t">Plate 4, the functions: pages equal rebuild of history; a rule is a pure check that refuses a false write; a measure is pure and its value is committed; a watch maps a change to another write up to depth 12; a model call is the one impure step; an answer is the first of habit, memory, thought and floor, the habit being planned; a lens maps pages to a surface and back, planned. One change runs write, rule, seal, watch, write, with refusal as a branch.</title>
