.t{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<text class="t" x="440" y="40" text-anchor="middle" font-size="34" font-weight="700" letter-spacing="9">THE UNHARNESSED HARNESS</text>
