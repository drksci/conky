<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 56" width="880" height="56" role="img" aria-labelledby="t">
<title id="t">The unharnessed harness</title>
<style>
:root{--ink:#1E1E1E;--tone:#E6E3DC;--acc:#F4C430}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EDEDED;--tone:#2B2F36}}
