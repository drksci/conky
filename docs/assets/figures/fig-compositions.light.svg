<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 0 848 376" width="848" height="376" role="img" aria-labelledby="t">
<title id="t">Plate 5, compositions: a pattern is a space plus rules plus watches; an approval is a proposal page plus seals, a rule and a watch; a budget is a measure plus a rule; a go-between is a page, a watch, a lens and providers in order; a character is a page plus a seed, a voice and asking; a breakpoint is a condition plus a hold; a habit is a case, a case and thinking when none fits, a case being when, then, because and expect; a warning is a watch, a price, an owner and a hold. Each is made by a character from the same parts.</title>
