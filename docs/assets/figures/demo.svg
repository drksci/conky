<rect x="4" y="4" width="412" height="392" rx="10" fill="#0d1117" stroke="#30363d"/>
<circle cx="22" cy="19" r="4.5" fill="#484f58"/>
<circle cx="38" cy="19" r="4.5" fill="#484f58"/>
<circle cx="54" cy="19" r="4.5" fill="#484f58"/>
<text class="tx" x="74" y="22.5" fill="#6C6C6C">$ conky demo</text>
<g class="a0 an"><rect x="20.5" y="34.5" width="383" height="24" rx="6" fill="none" stroke="#874BFD"/><text class="tx bd" x="31" y="50.5" fill="#FF5FAF">A lemonade stand</text></g>
<g class="a1 an"><rect x="20" y="68.4" width="18.9" height="12.6" rx="2" fill="#874BFD"/><text class="tx bd" x="29.45" y="78" fill="#EEEEEE" text-anchor="middle">1</text><text class="tx" x="45.2" y="78">Maya sets up the stand and writes down its one house</text><text class="tx" x="45.2" y="90.6">rule. The cooler never holds less than nothing.</text></g>
<g class="a2 an"><rect x="45.2" y="93.6" width="69.3" height="12.6" fill="#04B575"/><text class="tx bd" x="51.5" y="103.2" fill="#000" textLength="56.7" lengthAdjust="spacing">✓ written</text><text class="tx" x="127.1" y="103.2" fill="#EEEEEE">stand</text></g>
<g class="a3 an"><rect x="20" y="111.2" width="18.9" height="12.6" rx="2" fill="#874BFD"/><text class="tx bd" x="29.45" y="120.8" fill="#EEEEEE" text-anchor="middle">2</text><text class="tx" x="45.2" y="120.8">She fills the cooler with 40 cups. From now on it</text><text class="tx" x="45.2" y="133.4">follows the house rule.</text></g>
<g class="a4 an"><rect x="45.2" y="136.4" width="69.3" height="12.6" fill="#04B575"/><text class="tx bd" x="51.5" y="146" fill="#000" textLength="56.7" lengthAdjust="spacing">✓ written</text><text class="tx" x="127.1" y="146" fill="#EEEEEE">cooler</text></g>
<g class="a5 an"><rect x="20" y="154" width="18.9" height="12.6" rx="2" fill="#874BFD"/><text class="tx bd" x="29.45" y="163.6" fill="#EEEEEE" text-anchor="middle">3</text><text class="tx" x="45.2" y="163.6">The supplier is asked to keep an eye on the cooler. If</text><text class="tx" x="45.2" y="176.2">it drops below 10 cups, lemons are ordered.</text></g>
<g class="a6 an"><rect x="45.2" y="179.2" width="69.3" height="12.6" fill="#04B575"/><text class="tx bd" x="51.5" y="188.8" fill="#000" textLength="56.7" lengthAdjust="spacing">✓ written</text><text class="tx" x="127.1" y="188.8" fill="#EEEEEE">supplier</text></g>
<g class="a7 an"><rect x="20" y="196.8" width="18.9" height="12.6" rx="2" fill="#874BFD"/><text class="tx bd" x="29.45" y="206.4" fill="#EEEEEE" text-anchor="middle">4</text><text class="tx" x="45.2" y="206.4">Sam tries to write down minus one cup. The house rule</text><text class="tx" x="45.2" y="219">turns him away.</text></g>
<g class="a8 an"><rect x="45.2" y="222" width="69.3" height="12.6" fill="#FF5F87"/><text class="tx bd" x="51.5" y="231.6" fill="#000" textLength="56.7" lengthAdjust="spacing">✗ refused</text><text class="tx" x="127.1" y="231.6" fill="#EEEEEE">cooler</text></g>
<g class="a9 an"><text class="tx" x="57.8" y="244.2" fill="#6C6C6C">because rule: !has(page.cups) || page.cups &gt;= 0 (from</text><text class="tx" x="57.8" y="256.8" fill="#6C6C6C">stand) is false</text></g>
<g class="a10 an"><rect x="20" y="264.8" width="18.9" height="12.6" rx="2" fill="#874BFD"/><text class="tx bd" x="29.45" y="274.4" fill="#EEEEEE" text-anchor="middle">5</text><text class="tx" x="45.2" y="274.4">A busy hour takes the cooler down to 4 cups. Nobody</text><text class="tx" x="45.2" y="287">calls the supplier, and the order goes in anyway.</text></g>
<g class="a11 an"><rect x="45.2" y="290" width="69.3" height="12.6" fill="#04B575"/><text class="tx bd" x="51.5" y="299.6" fill="#000" textLength="56.7" lengthAdjust="spacing">✓ written</text><text class="tx" x="127.1" y="299.6" fill="#EEEEEE">cooler</text></g>
<g class="a12 an"><text class="tx" x="51.5" y="312.2"><tspan fill="#6C6C6C">↳ </tspan><tspan fill="#FFB454">supplier</tspan><tspan fill="#6C6C6C"> changed by itself</tspan></text></g>
<g class="a13 an"><rect x="20" y="320.2" width="18.9" height="12.6" rx="2" fill="#874BFD"/><text class="tx bd" x="29.45" y="329.8" fill="#EEEEEE" text-anchor="middle">7</text><text class="tx" x="45.2" y="329.8">A long entry goes into the daybook, and the daybook</text><text class="tx" x="45.2" y="342.4">notices its own weight.</text></g>
<g class="a14 an"><rect x="45.2" y="345.4" width="69.3" height="12.6" fill="#04B575"/><text class="tx bd" x="51.5" y="355" fill="#000" textLength="56.7" lengthAdjust="spacing">✓ written</text><text class="tx" x="127.1" y="355" fill="#EEEEEE">daybook</text></g>
<g class="a15 an"><text class="tx" x="51.5" y="367.6"><tspan fill="#6C6C6C">↳ </tspan><tspan fill="#FFB454">daybook</tspan><tspan fill="#6C6C6C"> changed by itself</tspan></text></g>
<text class="t" x="464" y="22" font-size="10.08" fill-opacity="1" text-anchor="start">A2UI</text>
<text class="t" x="876" y="22" font-size="8.4" fill-opacity="1" text-anchor="end">WIREFRAME</text>
