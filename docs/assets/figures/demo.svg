<g class="a17 an"><text class="sn" font-size="13.5" font-weight="600" aria-label="We never sell what we have not made."><tspan x="486" y="120">We never sell what</tspan><tspan x="486" y="136">we have not made.</tspan></text><text class="sn sm" x="486" y="157" font-size="10.5">I am Maya, and Sam helps me</text><text class="sn sm" x="486" y="169" font-size="10.5">on busy days.</text></g>
<path class="k" d="M674 78H864V178H674Z"/>
<text class="t" x="684" y="95" font-size="9.24" fill-opacity="1" text-anchor="start">COOLER</text>
