<defs><pattern id="d25" width="8" height="8" x="0" y="0" patternUnits="userSpaceOnUse"><path class="d" shape-rendering="crispEdges" d="M0 0h2v2h-2zM4 0h2v2h-2zM2 4h2v2h-2zM6 4h2v2h-2z"/></pattern><pattern id="d50" width="4" height="4" x="0" y="0" patternUnits="userSpaceOnUse"><path class="d" shape-rendering="crispEdges" d="M0 0h2v2h-2zM2 2h2v2h-2z"/></pattern></defs>
<g class="a0 an"><text class="tx bd" x="31.25" y="46" style="fill:var(--mute)" text-anchor="middle">1</text><text class="tx" x="50" y="46">Maya sets up the stand and writes down its one house</text><text class="tx" x="50" y="61">rule. The cooler never holds less than nothing.</text></g>
<g class="a1 an"><rect x="50.8" y="65.3" width="80.9" height="13.4" style="fill:none;stroke:var(--green);stroke-width:1.6"/><text class="tx bd" x="57.5" y="76" textLength="67.5" lengthAdjust="spacing">✓ written</text><text class="tx" x="147.5" y="76">stand</text></g>
<g class="a2 an"><text class="tx bd" x="31.25" y="97" style="fill:var(--mute)" text-anchor="middle">2</text><text class="tx" x="50" y="97">She fills the cooler with 40 cups. From now on it</text><text class="tx" x="50" y="112">follows the house rule.</text></g>
<g class="a3 an"><rect x="50.8" y="116.3" width="80.9" height="13.4" style="fill:none;stroke:var(--green);stroke-width:1.6"/><text class="tx bd" x="57.5" y="127" textLength="67.5" lengthAdjust="spacing">✓ written</text><text class="tx" x="147.5" y="127">cooler</text></g>
<g class="a4 an"><text class="tx bd" x="31.25" y="148" style="fill:var(--mute)" text-anchor="middle">3</text><text class="tx" x="50" y="148">The supplier is asked to keep an eye on the cooler. If</text><text class="tx" x="50" y="163">it drops below 10 cups, lemons are ordered.</text></g>
<g class="a5 an"><rect x="50.8" y="167.3" width="80.9" height="13.4" style="fill:none;stroke:var(--green);stroke-width:1.6"/><text class="tx bd" x="57.5" y="178" textLength="67.5" lengthAdjust="spacing">✓ written</text><text class="tx" x="147.5" y="178">supplier</text></g>
<g class="a6 an"><text class="tx bd" x="31.25" y="199" style="fill:var(--mute)" text-anchor="middle">4</text><text class="tx" x="50" y="199">Sam tries to write down minus one cup. The house rule</text><text class="tx" x="50" y="214">turns him away.</text></g>
<g class="a7 an"><rect x="50.8" y="218.3" width="80.9" height="13.4" style="fill:none;stroke:var(--coral);stroke-width:1.6"/><text class="tx bd" x="57.5" y="229" textLength="67.5" lengthAdjust="spacing">✗ refused</text><text class="tx" x="147.5" y="229">cooler</text></g>
<g class="a8 an"><text class="tx" x="65" y="244"  style="fill:var(--mute)">because rule: !has(page.cups) || page.cups &gt;= 0</text><text class="tx" x="65" y="259"  style="fill:var(--mute)">(from stand) is false</text></g>
<g class="a9 an"><text class="tx bd" x="31.25" y="280" style="fill:var(--mute)" text-anchor="middle">5</text><text class="tx" x="50" y="280">A busy hour takes the cooler down to 4 cups. Nobody</text><text class="tx" x="50" y="295">calls the supplier, and the order goes in anyway.</text></g>
<g class="a10 an"><rect x="50.8" y="299.3" width="80.9" height="13.4" style="fill:none;stroke:var(--green);stroke-width:1.6"/><text class="tx bd" x="57.5" y="310" textLength="67.5" lengthAdjust="spacing">✓ written</text><text class="tx" x="147.5" y="310">cooler</text></g>
<g class="a11 an"><text class="tx" x="57.5" y="325"><tspan style="fill:var(--mute)">↳ </tspan><tspan>supplier</tspan><tspan style="fill:var(--mute)"> changed by itself</tspan></text><path d="M72.5 328h60" style="fill:none;stroke:var(--yellow);stroke-width:1.6"/></g>
<g class="a12 an"><text class="tx bd" x="31.25" y="346" style="fill:var(--mute)" text-anchor="middle">7</text><text class="tx" x="50" y="346">A long entry goes into the daybook, and the daybook</text><text class="tx" x="50" y="361">notices its own weight.</text></g>
<g class="a13 an"><rect x="50.8" y="365.3" width="80.9" height="13.4" style="fill:none;stroke:var(--green);stroke-width:1.6"/><text class="tx bd" x="57.5" y="376" textLength="67.5" lengthAdjust="spacing">✓ written</text><text class="tx" x="147.5" y="376">daybook</text></g>
<g class="a14 an"><text class="tx" x="57.5" y="391"><tspan style="fill:var(--mute)">↳ </tspan><tspan>daybook</tspan><tspan style="fill:var(--mute)"> changed by itself</tspan></text><path d="M72.5 394h52.5" style="fill:none;stroke:var(--yellow);stroke-width:1.6"/></g>
