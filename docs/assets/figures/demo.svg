<mask id="wr" maskUnits="userSpaceOnUse" x="484" y="199" width="380" height="24"><rect class="rv" x="484" y="199" width="380" height="24" fill="#ffffff"/></mask>
<g class="a23 an"><g mask="url(#wr)"><text class="sn fz14" x="494" y="216">Two bags of lemons, please. We are nearly out.</text></g></g>
<g class="a24 an x"><path class="a" d="M481 169H867V233H481Z"/></g>
<path class="k" d="M484 236H864V376H484Z"/>
<text class="t fz12_6" x="494" y="255" fill-opacity="1" text-anchor="start">DAYBOOK</text>
<g class="a25 an x"><path class="k" d="M484 262L864 376"/><path class="k" d="M864 262L484 376"/><path class="k" d="M484 262L864 262"/></g>
<g class="a26 an"><text class="sn fz12_5"><tspan x="494" y="278">9:00. Opened up. Sunny, with a small breeze.</tspan></text></g>
<g class="a27 an"><text class="sn fz12_5"><tspan x="494" y="293">9:05. Forty cups in the cooler.</tspan></text></g>
<g class="a28 an"><text class="sn fz12_5"><tspan x="494" y="308">11:15. The cooler is down to four cups. ... The</tspan><tspan x="494" y="323">supplier ordered lemons by itself, which still makes</tspan><tspan x="494" y="338">me smile.</tspan></text></g>
<g class="a29 an"><text class="sn fz12_5"><tspan x="494" y="353">15:00. Wrote this entry. The day was longer than I</tspan><tspan x="494" y="368">expected, and I am happy with it.</tspan></text></g>
<g class="a30 an x"><circle class="k" cx="848" cy="250" r="3"/></g>
<g class="a31 an"><path class="f25" d="M841 250a7 7 0 1 0 14 0a7 7 0 1 0 -14 0Z"/>
<path class="s" d="M841 250a7 7 0 1 0 14 0a7 7 0 1 0 -14 0Z"/></g>
<g class="a32 an"><text class="t fz12_6" x="835" y="255" fill-opacity="1" text-anchor="end">PRESSURE</text></g>
<g class="a33 an"><text class="sn sm fz12_5" x="484" y="398">Sam tried to write minus one cup. The house rule said no.</text></g>
<g class="a34 an x"><path class="a" d="M484 58H864V78H484Z"/><text class="sn fz13" x="674" y="72.5" text-anchor="middle">Not allowed: we never sell what we have not made.</text></g>
