<g class="a19 an x"><text class="sn" x="684" y="132" font-size="34" font-weight="400">40</text><text class="sn" x="728" y="132" font-size="13">cups</text><path class="f25" d="M684 144H820V154H684Z"/>
<path class="s" d="M684 144H820V154H684Z"/></g>
<g class="a20 an"><text class="sn" x="684" y="132" font-size="34" font-weight="800">4</text><text class="sn" x="709" y="132" font-size="13">cups</text><path class="f25" d="M684 144H697.6V154H684Z"/>
<path class="s" d="M684 144H697.6V154H684Z"/></g>
<g class="a21 an"><path class="k" d="M684 144H854V154H684Z"/><text class="sn sm" x="684" y="169" font-size="10.5">Maya made 40 cups this morning.</text></g>
<path class="k" d="M476 184H864V236H476Z"/>
<text class="t" x="486" y="201" font-size="9.24" fill-opacity="1" text-anchor="start">SUPPLIER</text>
<g class="a22 an x"><path class="k" d="M476 207L864 236"/><path class="k" d="M864 207L476 236"/><path class="k" d="M476 207L864 207"/></g>
<g class="a23 an x"><path class="k" d="M486 222L726 222"/></g>
<mask id="wr" maskUnits="userSpaceOnUse" x="476" y="206" width="388" height="24"><rect class="rv" x="476" y="206" width="388" height="24" fill="#fff"/></mask>
<g class="a24 an"><g mask="url(#wr)"><text class="sn" x="486" y="222" font-size="13.5">Two bags of lemons, please. We are nearly out.</text></g></g>
<g class="a25 an x"><path class="a" d="M473 181H867V239H473Z"/></g>
<path class="k" d="M476 242H864V352H476Z"/>
<text class="t" x="486" y="259" font-size="9.24" fill-opacity="1" text-anchor="start">DAYBOOK</text>
<g class="a26 an x"><path class="k" d="M476 265L864 352"/><path class="k" d="M864 265L476 352"/><path class="k" d="M476 265L864 265"/></g>
<g class="a27 an"><text class="sn" font-size="10.5"><tspan x="486" y="278">9:00. Opened up. Sunny, with a small breeze.</tspan></text></g>
<g class="a28 an"><text class="sn" font-size="10.5"><tspan x="486" y="290.4">9:05. Forty cups in the cooler.</tspan></text></g>
<g class="a29 an"><text class="sn" font-size="10.5"><tspan x="486" y="302.8">11:15. The cooler is down to four cups. ... The supplier ordered</tspan><tspan x="486" y="315.2">lemons by itself, which still makes me smile.</tspan></text></g>
<g class="a30 an"><text class="sn" font-size="10.5"><tspan x="486" y="327.6">15:00. Wrote this entry. The day was longer than I expected, and I</tspan><tspan x="486" y="340">am happy with it.</tspan></text></g>
<g class="a31 an x"><circle class="k" cx="848" cy="255" r="3"/></g>
