<g class="a34 an"><text class="sn sm" x="476" y="369" font-size="10.5">Sam tried to write down minus one cup. The house rule said no.</text></g>
<g class="a35 an x"><path class="a" d="M476 56H864V74H476Z"/><text class="sn" x="670" y="69" font-size="11.5" text-anchor="middle">Not allowed: we never sell what we have not made.</text></g>
