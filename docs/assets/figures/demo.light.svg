<text class="tx" x="74" y="22.5" fill="#6C6C6C">$ conky demo</text>
<g class="a0 an"><rect x="20.5" y="34.5" width="383" height="24" rx="6" fill="none" stroke="#874BFD"/><text class="tx bd" x="31" y="50.5" fill="#FF5FAF">A market stall</text></g>
<g class="a1 an"><rect x="20" y="68" width="19.86" height="13.4" rx="2" fill="#874BFD"/><text class="tx bd" x="29.93" y="78" fill="#EEEEEE" text-anchor="middle">1</text><text class="tx" x="46.48" y="78">A market is a space. It carries one rule for</text><text class="tx" x="46.48" y="91.4">everything inside it. Stock is never negative.</text></g>
<g class="a2 an"><rect x="46.48" y="94.8" width="72.82" height="13.4" fill="#04B575"/><text class="tx bd" x="53.1" y="104.8" fill="#000" textLength="59.58" lengthAdjust="spacing">✓ written</text><text class="tx" x="132.54" y="104.8" fill="#EEEEEE">market</text></g>
<g class="a3 an"><rect x="20" y="113.7" width="19.86" height="13.4" rx="2" fill="#874BFD"/><text class="tx bd" x="29.93" y="123.7" fill="#EEEEEE" text-anchor="middle">2</text><text class="tx" x="46.48" y="123.7">A stall joins the market with 40 loaves in stock. It</text><text class="tx" x="46.48" y="137.1">follows the market's rule from now on.</text></g>
<g class="a4 an"><rect x="46.48" y="140.5" width="72.82" height="13.4" fill="#04B575"/><text class="tx bd" x="53.1" y="150.5" fill="#000" textLength="59.58" lengthAdjust="spacing">✓ written</text><text class="tx" x="132.54" y="150.5" fill="#EEEEEE">stall</text></g>
<g class="a5 an"><rect x="20" y="159.4" width="19.86" height="13.4" rx="2" fill="#874BFD"/><text class="tx bd" x="29.93" y="169.4" fill="#EEEEEE" text-anchor="middle">3</text><text class="tx" x="46.48" y="169.4">A depot page is set up to watch the stall. When</text><text class="tx" x="46.48" y="182.8">stock falls below 10 it marks a reorder.</text></g>
<g class="a6 an"><rect x="46.48" y="186.2" width="72.82" height="13.4" fill="#04B575"/><text class="tx bd" x="53.1" y="196.2" fill="#000" textLength="59.58" lengthAdjust="spacing">✓ written</text><text class="tx" x="132.54" y="196.2" fill="#EEEEEE">depot</text></g>
<g class="a7 an"><rect x="20" y="205.1" width="19.86" height="13.4" rx="2" fill="#874BFD"/><text class="tx bd" x="29.93" y="215.1" fill="#EEEEEE" text-anchor="middle">4</text><text class="tx" x="46.48" y="215.1">Someone tries to set the stall's stock to minus one.</text><text class="tx" x="46.48" y="228.5">The market's rule forbids it.</text></g>
<g class="a8 an"><rect x="46.48" y="231.9" width="72.82" height="13.4" fill="#FF5F87"/><text class="tx bd" x="53.1" y="241.9" fill="#000" textLength="59.58" lengthAdjust="spacing">✗ refused</text><text class="tx" x="132.54" y="241.9" fill="#EEEEEE">stall</text></g>
<g class="a9 an"><text class="tx" x="59.72" y="255.3" fill="#6C6C6C">because rule: !has(page.stock) || page.stock &gt;= 0</text><text class="tx" x="59.72" y="268.7" fill="#6C6C6C">(from market) is false</text></g>
<g class="a10 an"><rect x="20" y="277.6" width="19.86" height="13.4" rx="2" fill="#874BFD"/><text class="tx bd" x="29.93" y="287.6" fill="#EEEEEE" text-anchor="middle">5</text><text class="tx" x="46.48" y="287.6">The stall sells down to 4 loaves. Nobody tells the</text><text class="tx" x="46.48" y="301">depot, and it reacts on its own.</text></g>
<g class="a11 an"><rect x="46.48" y="304.4" width="72.82" height="13.4" fill="#04B575"/><text class="tx bd" x="53.1" y="314.4" fill="#000" textLength="59.58" lengthAdjust="spacing">✓ written</text><text class="tx" x="132.54" y="314.4" fill="#EEEEEE">stall</text></g>
<g class="a12 an"><text class="tx" x="53.1" y="327.8"><tspan fill="#6C6C6C">↳ </tspan><tspan fill="#FFB454">depot</tspan><tspan fill="#6C6C6C"> changed by itself</tspan></text></g>
<g class="a13 an"><rect x="20" y="336.7" width="19.86" height="13.4" rx="2" fill="#874BFD"/><text class="tx bd" x="29.93" y="346.7" fill="#EEEEEE" text-anchor="middle">7</text><text class="tx" x="46.48" y="346.7">A long entry goes into the journal, and the journal</text><text class="tx" x="46.48" y="360.1">measures itself again.</text></g>
<g class="a14 an"><rect x="46.48" y="363.5" width="72.82" height="13.4" fill="#04B575"/><text class="tx bd" x="53.1" y="373.5" fill="#000" textLength="59.58" lengthAdjust="spacing">✓ written</text><text class="tx" x="132.54" y="373.5" fill="#EEEEEE">journal</text></g>
<g class="a15 an"><text class="tx" x="53.1" y="386.9"><tspan fill="#6C6C6C">↳ </tspan><tspan fill="#FFB454">journal</tspan><tspan fill="#6C6C6C"> changed by itself</tspan></text></g>
