<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" width="880" height="272" role="img" aria-labelledby="t">
<title id="t">Plate 5, compositions: a pattern is a space plus rules plus watches; an approval is a proposal page plus seals, a rule and a watch; a budget is a measure plus a rule; a go-between is a page, a watch, a lens and providers in order; a character is a page plus a seed, a voice and asking; a breakpoint is a condition plus a hold. Each is made by a character from the same parts.</title>
