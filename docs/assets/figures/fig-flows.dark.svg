<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 258" width="880" height="258" role="img" aria-labelledby="t">
<title id="t">Plate 6, the flows, as a swimlane: a stimulus reaches a connector, which writes a page; the runtime checks the rules and either records a refusal or signs and appends the change; watching pages react, may ask a provider, and their answers go round the same loop; writes to a connector's page leave as actions; the screen and a returning prompt are planned.</title>
