<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="t">
<title id="t">One page reacts to another</title>
<style>
:root{--ink:#1E1E1E;--tone:#E6E3DC;--acc:#F4C430}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EDEDED;--tone:#2B2F36}}
:root[data-theme="dark"]{--ink:#EDEDED;--tone:#2B2F36}
.i,.k,.a,.h,.z,.y{fill:none;stroke-linecap:round;stroke-linejoin:round}
.i{stroke:var(--ink);stroke-width:3.0}
.k{stroke:var(--ink);stroke-width:2.2}
.a{stroke:var(--acc);stroke-width:3.8}
.h{stroke:var(--ink);stroke-width:1.2}
.z{stroke:var(--ink);stroke-width:3.0;stroke-dasharray:4 6}
.y{stroke:var(--acc);stroke-width:3.8;stroke-dasharray:3 7}
.d{fill:var(--ink);stroke:none}
.s{fill:var(--tone);stroke:var(--ink);stroke-width:3.0;stroke-linecap:round;stroke-linejoin:round}
.m{fill:var(--tone);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.t{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em}
.b{font-weight:700}
</style>
