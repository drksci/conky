<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="800" height="210" role="img" aria-labelledby="t">
<title id="t">A graph of pages composing itself: the screen changes and Ma and Jed notice; Ma reads The Art of War from the patterns shelf; Jed's wish to hunt stops at the house rules; Ma pushes on at the campfire; the hands type back to the game; the diary gains a line</title>
