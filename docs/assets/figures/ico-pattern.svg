<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="t">
<title id="t">Shapes joined into one arrangement</title>
<style>
:root{--ink:#1E1E1E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EDEDED}}
:root[data-theme="dark"]{--ink:#EDEDED}
.i,.k,.a,.h,.z,.y{fill:none;stroke-linecap:round;stroke-linejoin:round}
.i{stroke:var(--ink);stroke-width:3.0}
.k{stroke:var(--ink);stroke-width:2.2}
.a{stroke:var(--ink);stroke-width:4.5}
.h{stroke:var(--ink);stroke-width:1.2}
.z{stroke:var(--ink);stroke-width:3.0;stroke-dasharray:4 6}
.y{stroke:var(--ink);stroke-width:4.5;stroke-dasharray:1 9}
.d{fill:var(--ink);stroke:none}
.s{fill:none;stroke:var(--ink);stroke-width:3.0;stroke-linecap:round;stroke-linejoin:round}
.f12,.f25,.f50{stroke:none;fill-rule:evenodd}
.f12{fill:url(#d12)}
.f25{fill:url(#d25)}
.f50{fill:url(#d50)}
.t{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em}
.b{font-weight:700}
</style>

