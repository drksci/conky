# A within rule binds a page at any depth below the space that carries it.
pages:
  den:
    cash: 80
    rules:
      - within: "page.amount <= space.cash - 20"
  shelf:
    within: den
    amount: 0
  drawer:
    within: shelf
    amount: 0
steps:
  - write: {page: pay-a, fields: {within: drawer, amount: 70}}
  - expect: {refused: rule, missing: [pay-a]}
  - write: {page: pay-b, fields: {within: drawer, amount: 10}}
  - expect: {exists: [pay-b], verify: true}
