# A new situation still goes to thought, even when cases exist.
pages:
  helper: {api: command, command: stand}
  camp: {}
  gate: {asks: "", turn: 0}
  guide:
    within: camp
    handled: -1
    said: ""
    watch:
      - on: gate
        when: page.handled != other.turn
        ask: {provider: helper, prompt: "The gate asks: ![[gate#asks]]", into: said, writes: camp}
steps:
  - says: |-
      no
      === page: guide ===
      ---
      watch:
        - on: gate
          when: "other.asks == 'ford'"
          set: {said: "'no'", handled: other.turn}
        - on: gate
          when: page.handled != other.turn
          ask: {provider: helper, prompt: "The gate asks: ![[gate#asks]]", into: said, writes: camp}
      ---
  - write: {page: gate, fields: {asks: ford, turn: 1}}
  - says: |-
      rest
      === page: guide ===
      ---
      watch:
        - on: gate
          when: "other.asks == 'ford'"
          set: {said: "'no'", handled: other.turn}
        - on: gate
          when: "other.asks == 'storm'"
          set: {said: "'rest'", handled: other.turn}
        - on: gate
          when: page.handled != other.turn
          ask: {provider: helper, prompt: "The gate asks: ![[gate#asks]]", into: said, writes: camp}
      ---
  - write: {page: gate, fields: {asks: storm, turn: 2}}
  - expect: {fields: {guide.said: rest}, model_calls: 2, verify: true}
