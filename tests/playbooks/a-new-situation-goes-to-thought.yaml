# A new situation still goes to thought, even when cases exist.
pages:
  helper: {api: command, command: stand}
  camp: {}
  gate: {asks: ""}
  guide:
    within: camp
    met: ""
    said: ""
    watch:
      - on: gate
        when: page.met != event.id
        ask: {provider: helper, prompt: "The gate asks: ![[gate#asks]]", into: said, writes: camp}
steps:
  - says: |-
      no
      === page: guide ===
      ---
      watch:
        - on: gate
          when: "other.asks == 'ford'"
          set: {said: "'no'", met: event.id}
        - on: gate
          when: page.met != event.id
          ask: {provider: helper, prompt: "The gate asks: ![[gate#asks]]", into: said, writes: camp}
      ---
  - write: {page: gate, fields: {asks: ford}}
  - says: |-
      rest
      === page: guide ===
      ---
      watch:
        - on: gate
          when: "other.asks == 'ford'"
          set: {said: "'no'", met: event.id}
        - on: gate
          when: "other.asks == 'storm'"
          set: {said: "'rest'", met: event.id}
        - on: gate
          when: page.met != event.id
          ask: {provider: helper, prompt: "The gate asks: ![[gate#asks]]", into: said, writes: camp}
      ---
  - write: {page: gate, fields: {asks: storm}}
  - expect: {fields: {guide.said: rest}, model_calls: 2, verify: true}
