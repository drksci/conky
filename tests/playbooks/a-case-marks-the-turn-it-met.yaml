# A connector's screen page carries a turn, so a case can mark the turn it met instead of the event.
pages:
  helper: {api: command, command: stand}
  camp: {}
  gate: {asks: "", turn: 0}
  guide:
    within: camp
    handled: -1
    said: ""
    watch:
      - on: gate
        when: "other.asks == 'ford'"
        set: {said: "'no'", handled: other.turn}
      - on: gate
        when: page.handled != other.turn
        ask: {provider: helper, prompt: "The gate asks: ![[gate#asks]]", into: said}
steps:
  - write: {page: gate, fields: {asks: ford, turn: 1}}
  - expect: {fields: {guide.said: "no"}, model_calls: 0}
  - says: "yes"
  - write: {page: gate, fields: {asks: hunt, turn: 2}}
  - expect: {fields: {guide.said: "yes"}, model_calls: 1, verify: true}
