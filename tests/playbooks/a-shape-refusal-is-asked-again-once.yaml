# A page block with no name is refused for its shape, and the question is asked again once with the reason; the same answer is refused again and it stops.
pages:
  helper: {api: command, command: stand}
  camp: {}
  gate: {asks: ""}
  guide:
    within: camp
    said: ""
    watch:
      - on: gate
        when: "other.asks != ''"
        ask: {provider: helper, prompt: "The gate asks: ![[gate#asks]]", into: said, writes: camp}
steps:
  - says: "kept\n=== page:  ===\nhello\n=== end ==="
  - write: {page: gate, fields: {asks: hunt}}
  - expect: {fields: {guide.said: "kept"}, model_calls: 2, verify: true}
