# A page called order is not linked by the word order: a name is a phrase only when listed.
pages:
  order:
    n: 0
    watch:
      - on: link
        when: "true"
        set: {n: "page.n + 1"}
steps:
  - write: {page: a, body: "the order of things"}
  - expect: {fields: {order.n: 0}}
  - write: {page: b, body: "see [[order]]"}
  - expect: {fields: {order.n: 1}, verify: true}
