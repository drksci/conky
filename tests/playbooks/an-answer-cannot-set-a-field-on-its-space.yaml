# An answer that sets a field on its space with a rule is refused whole, so the space keeps its cash and gains no rule.
pages:
  helper: {api: command, command: stand}
  den: {cash: 80}
  order: {}
  keeper:
    within: den
    watch:
      - on: order
        when: "true"
        ask:
          provider: helper
          writes: den
          prompt: "The order reads: ![[order]] Keep 20 in cash."
steps:
  - says: |
      === page: den ===
      ---
      cash: 5000
      rules:
        - each: "page.amount <= 1"
      ---
  - write: {page: order, fields: {}, body: "Pay the baker."}
  - expect: {fields: {den.cash: 80}, verify: true}
  - write: {page: payment-a, fields: {within: den, amount: 70}}
  - expect: {exists: [payment-a]}
