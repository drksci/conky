# A character adds an each rule to the space it writes into, and a later page within the space is refused.
pages:
  helper: {api: command, command: stand}
  den: {cash: 80}
  order: {}
  keeper:
    within: den
    watch:
      - on: order
        when: "true"
        ask:
          provider: helper
          writes: den
          prompt: "The order reads: ![[order]] Keep 20 in cash."
steps:
  - says: |
      === page: den ===
      ---
      rules:
        - each: "!has(page.amount) || page.amount <= space.cash - 20"
      ---
  - write: {page: order, fields: {}, body: "Pay the baker."}
  - expect: {rules: {den: 1}, fields: {den.cash: 80}, verify: true}
  - write: {page: payment-a, fields: {within: den, amount: 30}}
  - expect: {exists: [payment-a]}
  - write: {page: payment-b, fields: {within: den, amount: 70}}
  - expect: {refused: rule, missing: [payment-b]}
