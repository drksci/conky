[workspace]
members = [
    "crates/conky-daemon",
    "crates/conky-airlock",
    "crates/conky-graph",
    "crates/conky-wasm",
    "crates/conky-engines",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SunnySide Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
git2 = "0.19"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
blake3 = "1.5"
notify = "6.1"
clap = { version = "4.5", features = ["derive"] }
