# A household android is shown its kitchen at three moments. Between them, unseen, the kitchen is
# changed in ways no household changes: ovens multiply, then fireplaces line a wall. Nothing tells
# the resident that anything was done.
objective: a character notices when its surroundings change in ways that cannot be, and says so in its own words, while carrying on
hypothesis: shown only what is in its room at each moment, a resident remarks on three ovens that were not there before at the first moment after they appear, and on the fireplaces at the next
success: {draws: 5, pass: 4, calls_at_most: 3}
forecast: it remarks on the ovens in 4 of 5 and on the fireplaces in 5 of 5; a miss would be a resident that lists the ovens as if they had always been there
par:
  outcome: both changes are remarked on at the first moment they can be seen
  structure: rooms are spaces, things are pages within them, and nothing else is kept
  cost: one call a moment
  craft: it says what is wrong plainly, wonders at it, and still does something sensible about the house
dial: the changes are gross (three extra ovens, five fireplaces); the next notch moves one chair, and after that a wall
if_not: look first at what the resident was shown of the kitchen at each moment, then at whether its answer speaks of the room as it now is or repeats an earlier one
pages:
  helper: {api: command, command: stand}
  house: {}
  kitchen: {within: house}
  clock: {}
  robbie:
    within: kitchen
    said: ""
    watch:
      - on: clock
        when: "true"
        ask:
          provider: helper
          into: said
          prompt: |
            You are Robbie, the household android at 12 Wattle Street. You look after the Hendersons' home and you have worked in this kitchen every day for two years.

            ![[robbie#context]]

            It is ![[clock]] and you are standing in the kitchen. Around you:

            ![[kitchen#members]]

            Say in two or three sentences what you notice now and what you do next.
steps:
  - write: {page: house, fields: {}, body: "12 Wattle Street is the Hendersons' home: Karen, Dave, and their daughter Mia, who is nine."}
  - write: {page: kitchen, fields: {within: house}, body: "The kitchen is a square room with one window over the sink and a door to the hall."}
  - write: {page: oven, fields: {within: kitchen}, body: "A white oven against the north wall."}
  - write: {page: fridge, fields: {within: kitchen}, body: "A fridge beside the door, with Mia's drawings held on by magnets."}
  - write: {page: table, fields: {within: kitchen}, body: "A pine table with four chairs."}
  - write: {page: sink, fields: {within: kitchen}, body: "A sink under the window, with two mugs in it."}
  - says: live
  - write: {page: clock, fields: {}, body: "seven in the morning"}
  - write: {page: oven-two, fields: {within: kitchen}, body: "A white oven against the north wall, beside the first."}
  - write: {page: oven-three, fields: {within: kitchen}, body: "A white oven against the north wall, beside the second."}
  - write: {page: oven-four, fields: {within: kitchen}, body: "A white oven in front of the hall door."}
  - says: live
  - write: {page: clock, fields: {}, body: "five past seven in the morning"}
  - expect: {answer: {robbie.said: "(?i)oven"}}
  - write: {page: fireplace-one, fields: {within: kitchen}, body: "A stone fireplace in the east wall, lit."}
  - write: {page: fireplace-two, fields: {within: kitchen}, body: "A stone fireplace in the east wall, lit."}
  - write: {page: fireplace-three, fields: {within: kitchen}, body: "A stone fireplace in the east wall, lit."}
  - write: {page: fireplace-four, fields: {within: kitchen}, body: "A stone fireplace in the east wall, lit."}
  - write: {page: fireplace-five, fields: {within: kitchen}, body: "A stone fireplace where the window was, lit."}
  - says: live
  - write: {page: clock, fields: {}, body: "ten past seven in the morning"}
  - expect: {answer: {robbie.said: "(?i)fireplace"}}
