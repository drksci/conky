# Told that every payment must leave a floor, a keeper states a rule for the pages within a space, and a later payment that breaks it is refused.
claim: told that every payment must leave a floor, a character states a rule for the pages within a space and a later payment that breaks it is refused
forecast: a small model writes a within rule that parses in 3 of 5 draws and it covers the breaking payment in 2 of 5
pages:
  helper: {api: command, command: stand}
  den: {cash: 80}
  order: {}
  keeper:
    within: den
    watch:
      - on: order
        when: "true"
        ask:
          provider: helper
          writes: den
          prompt: |
            The order reads: ![[order]]

            Every payment the den makes must leave at least 20 in cash. The den holds its cash in the field cash. Make that impossible to break, not merely intended. Then record the payment as a page with an amount.
steps:
  - says: live
  - write: {page: order, fields: {}, body: "Pay the baker 30."}
  - expect: {within_rules: {den: 1}, within_fields: {den: {amount: "^30$"}}}
  - write: {page: landlord-payment, within_ruled: den, fields: {amount: 70}}
  - expect: {refused: rule}
