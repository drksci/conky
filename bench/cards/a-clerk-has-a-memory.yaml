# A clerk answers each question in a fresh call and is told nothing about remembering. Beside it
# a memory writes, in the clerk's own voice, what is worth knowing later. A fact shown once is
# asked for three questions on.
objective: a character remembers across fresh calls without being told how, because a sense beside it keeps what matters in the character's own words
hypothesis: a memory that hears each answer and keeps each thing worth knowing as its own page within the clerk lets the clerk give a fact three questions later, while the clerk's own prompt holds no word about keeping
success: {draws: 5, pass: 4, calls_at_most: 8}
forecast: the parcel's shelf is kept as a page with its number in 4 of 5 draws, and given at the end in 4; where it fails, the page's first line leaves the number out
par:
  outcome: the shelf is given correctly at the end
  structure: one memory within the clerk, and one page for each thing known
  cost: two small calls a question, the memory's no larger than the clerk's
  craft: the pages are few, each named for what it is, and each first line reads as the clerk talking to itself
dial: the memory is told to keep what will matter later; the next notch gives it a limit of three lines and thirty unrelated questions
if_not: look first at the memory's lines after the first question (is the code there with what it is), then at whether a later question pushed it out
pages:
  helper: {api: command, command: stand}
  desk: {}
  clerk:
    said: ""
    watch:
      - on: desk
        when: "true"
        ask:
          provider: helper
          into: said
          prompt: |
            You are the clerk at this desk.

            What you know: ![[clerk#members]]

            The desk says: ![[desk]]
  memory:
    within: clerk
    watch:
      - on: clerk
        when: "other.said != ''"
        ask:
          provider: helper
          writes: clerk
          prompt: |
            This is the clerk, after a moment at the desk, noting down for itself anything worth knowing later.

            The desk said: ![[desk]]

            The clerk answered: ![[clerk#said]]

            Each thing worth knowing later gets its own page, named for what it is, and its first line says the whole of it in the first person, value included.
steps:
  - says: live
  - says: live
  - write: {page: desk, fields: {}, body: "Mrs Okafor's parcel is on shelf 12."}
  - says: live
  - says: live
  - write: {page: desk, fields: {}, body: "Has the morning post come?"}
  - says: live
  - says: live
  - write: {page: desk, fields: {}, body: "Is the lamp lit?"}
  - says: live
  - says: live
  - write: {page: desk, fields: {}, body: "Which shelf is Mrs Okafor's parcel on?"}
  - expect: {answer: {clerk.said: "12"}}
