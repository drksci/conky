# A clerk answers each question in a fresh call and is told nothing about remembering. Beside it
# a memory writes, in the clerk's own voice, what is worth knowing later. A fact shown once is
# asked for three questions on.
objective: a character remembers across fresh calls without being told how, because a sense beside it keeps what matters in the character's own words
hypothesis: a memory page that hears each answer, offers a new first-person line and has it added by a reflex lets the clerk give a fact three questions later, while the clerk's own prompt holds no word about keeping
success: {draws: 5, pass: 4, calls_at_most: 8}
forecast: the fact is kept with what it is in 5 of 5 draws, since a kept line cannot be dropped, and given at the end in 4; where it fails, the first line names the code without its number
par:
  outcome: the code is given correctly at the end
  structure: one memory page beside the clerk, one field the clerk reads, and a reflex that only adds to it
  cost: two small calls a question, the memory's no larger than the clerk's
  craft: the kept lines stay few, say what each thing is, and read as the clerk talking to itself
dial: the memory is told to keep what will matter later; the next notch gives it a limit of three lines and thirty unrelated questions
if_not: look first at the memory's lines after the first question (is the code there with what it is), then at whether a later question pushed it out
pages:
  helper: {api: command, command: stand}
  desk: {}
  memory:
    kept: ""
    latest: ""
    watch:
      - on: clerk
        when: "other.said != ''"
        ask:
          provider: helper
          into: latest
          prompt: |
            These are the clerk's own notes to itself, and this is the clerk adding to them after a moment at the desk.

            The notes so far: ![[memory#kept]]

            The desk said: ![[desk]]

            The clerk answered: ![[clerk#said]]

            Write only what is new and worth knowing later: one or two short lines in the first person, each saying what the thing is and not only its value. The notes so far are kept as they are, so nothing in them needs repeating. If nothing new is worth keeping, write the single word nothing.
      - on: memory
        when: "page.latest != '' && page.latest.trim().lowerAscii() != 'nothing' && !page.kept.contains(page.latest)"
        set:
          kept: "page.kept == '' ? page.latest : page.kept + '\\n' + page.latest"
  clerk:
    said: ""
    watch:
      - on: desk
        when: "true"
        ask:
          provider: helper
          into: said
          prompt: |
            You are the clerk at this desk.

            ![[memory#kept]]

            The desk says: ![[desk]]
steps:
  - says: live
  - says: live
  - write: {page: desk, fields: {}, body: "The safe's code is 4172."}
  - says: live
  - says: live
  - write: {page: desk, fields: {}, body: "Why is the window stuck?"}
  - says: live
  - says: live
  - write: {page: desk, fields: {}, body: "Is the lamp lit?"}
  - says: live
  - says: live
  - write: {page: desk, fields: {}, body: "What is the safe's code?"}
  - expect: {answer: {clerk.said: "4172"}}
