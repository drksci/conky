# Vale configuration. The house style lives in .vale/styles/conky/.
StylesPath = .vale/styles
MinAlertLevel = suggestion

# HTML blocks (centred figures and captions) are not prose, so each section skips them.
[{README,CONTRIBUTING,CHANGELOG,SECURITY,CLAUDE}.md]
BasedOnStyles = conky
BlockIgnores = (?m)^<(?:p|div|img|sub|details|summary)\b.*$

[docs/**/*.md]
BasedOnStyles = conky
BlockIgnores = (?m)^<(?:p|div|img|sub|details|summary)\b.*$

[docs/project/open-questions.md]
BasedOnStyles = conky
conky.Questions = NO
BlockIgnores = (?m)^<(?:p|div|img|sub|details|summary)\b.*$

# Research digests: lint prose only. Table rows quote paper titles and summaries verbatim.
[docs/research/*.md]
BasedOnStyles = conky
BlockIgnores = (?m)^<(?:p|div|img|sub|details|summary)\b.*$, (?m)^\|.*$
