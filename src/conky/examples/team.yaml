title: A small team
summary: A team space where every task needs an owner, and a board that reacts when a task is done.
look_at: board
steps:
  - say: Alice starts a team with one house rule. Every task has to have an owner.
    write:
      page: team
      actor: alice
      fields:
        rules: [{each: "!has(page.status) || page.owner != ''"}]
  - say: The board is set up to watch the first task. When the task is done, it adds one to its count.
    write:
      page: board
      actor: alice
      fields:
        done: 0
        watch:
          - on: task-1
            when: other.status == 'done'
            set:
              done: page.done + 1
  - say: Alice adds the first task, gives it to Bob and leaves it open.
    write:
      page: task-1
      actor: alice
      fields:
        within: team
        status: open
        owner: bob
      body: Write the first draft.
  - say: Someone tries to hand the task to nobody. The house rule turns that away.
    write:
      page: task-1
      actor: alice
      fields:
        owner: ""
  - say: Bob finishes the task. Nobody tells the board, and it counts the task anyway.
    write:
      page: task-1
      actor: bob
      fields:
        status: done
