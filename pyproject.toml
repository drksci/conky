[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conky"
version = "0.1.0"
description = "A small runtime where every actor, tool, data store and rule is a living Markdown page."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["pyyaml>=6", "cryptography>=42", "cel-python>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/drksci/conky"

[project.scripts]
conky = "conky.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conky"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
